<!-- Hộp chat -->
<div *ngIf="isChatOpen" class="chat-container">
  <div class="chat-box">
    <div class="chat-header">
      <button (click)="toggleChat()">X</button>
    </div>
    <div class="chat-body">
      <!-- Hiển thị các tin nhắn -->
      <div class="messages-container">
        <div *ngFor="let message of messages" [ngClass]="{'user-message': message.sender === 'user', 'bot-message': message.sender === 'bot'}">
          <p>{{ message.text }}</p>
        </div>
      </div>

      <!-- Form nhập tin nhắn -->
      <div class="input-container">
        <input type="text" [(ngModel)]="userMessage" placeholder="Nhập tin nhắn..." />
        <button (click)="sendMessage()">Gửi</button>
      </div>

      <!-- Hiển thị phản hồi của bot -->
      
    </div>
  </div>
</div>

<!-- Icon chat ở góc dưới -->
<button class="chat-icon" (click)="toggleChat()">
  <img src="https://img.icons8.com/ios/50/000000/chat.png" alt="Chat Icon" />
</button>
